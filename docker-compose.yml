# Local PostgreSQL for the RCA module.
# Host port 54329 avoids clashing with a Postgres already installed on 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca
      POSTGRES_DB: rca
    ports:
      - "54329:5432"
    volumes:
      - rca_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rca_pg:
